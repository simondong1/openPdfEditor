name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile pdf_explorer.py

  build-windows:
    runs-on: windows-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name openPdfEditor pdf_explorer.py
      - uses: actions/upload-artifact@v4
        with:
          name: openPdfEditor-windows
          path: dist/openPdfEditor.exe
