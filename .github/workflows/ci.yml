name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile pdf_explorer.py

  build-windows:
    runs-on: windows-latest
    needs: compile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name openPdfEditor pdf_explorer.py
      - name: Verify Windows GUI executable
        run: python -c "import pathlib, pefile; p=pathlib.Path('dist/openPdfEditor.exe'); pe=pefile.PE(str(p)); assert pe.OPTIONAL_HEADER.Subsystem == 2, 'executable must use the Windows GUI subsystem'; assert p.stat().st_size > 1000000, 'executable is unexpectedly small'"
      - uses: actions/upload-artifact@v4
        with:
          name: openPdfEditor-windows
          path: dist/openPdfEditor.exe
