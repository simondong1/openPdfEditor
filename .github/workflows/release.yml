name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile pdf_explorer.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name openPdfEditor pdf_explorer.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" dist/openPdfEditor.exe --repo $env:GITHUB_REPOSITORY --generate-notes --verify-tag
