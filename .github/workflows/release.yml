name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m py_compile pdf_explorer.py
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name openPdfEditor pdf_explorer.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/openPdfEditor.exe
